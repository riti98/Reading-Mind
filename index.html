<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Mind — My Book Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/bookshelf.css" />
</head>
<body>
  <header class="site-header">
    <h1>Riti's Bookshelf</h1>
  </header>

  <main>
    <section id="bookshelf" class="bookshelf" aria-label="Book collection"></section>

    <aside id="book-detail" class="book-detail hidden" aria-live="polite">
      <div class="detail-topbar">
        <button id="close-detail" class="close-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6.4 19L5 17.6L10.6 12L5 6.4L6.4 5L12 10.6L17.6 5L19 6.4L13.4 12L19 17.6L17.6 19L12 13.4L6.4 19Z" />
          </svg>
        </button>
      </div>
      <div id="book-detail-content" class="detail-content"></div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
